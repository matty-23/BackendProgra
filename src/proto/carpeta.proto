syntax = "proto3";

package carpetas;

service CarpetaService {
  rpc GetById (CarpetaIdRequest) returns (CarpetaDto) {}
  rpc GetComponentes (CarpetaIdRequest) returns (ComponentesResponse) {}
  rpc Registrar (RegistrarCarpetaRequest) returns (CarpetaDto) {}
  rpc Actualizar (ActualizarCarpetaRequest) returns (EmptyResponse) {}
  rpc Eliminar (CarpetaIdRequest) returns (EmptyResponse) {}
  rpc CarpetasPrincipales (CarpetaIdRequest) returns (MiAreaResponse) {}
}

// La respuesta ahora tiene 3 listas independientes
message MiAreaResponse {
    repeated ComponenteDtoGRPC listaUno = 1;
    /*repeated ComponenteDtoGRPC listaDos = 2;
    repeated ComponenteDtoGRPC listaTres = 3;
    repeated ComponenteDtoGRPC listaCuatro = 4;*/
}

// Tu DTO del componente igual que siempre
message ComponenteDtoGRPC {
    string id = 1;
    string nombre = 2;
    string fechaCreacion = 3;
    string fechaUltimaModificacion = 4;
    string idUsuario = 5;
    string ReadMe = 6;
    repeated ComponenteDtoGRPC componentes = 7;
}

message CarpetaDto {
  string id = 1;
  string nombre = 2;
  string fechaCreacion = 3;             
  string fechaUltimaModificacion = 4;
  string idUsuario = 5;
  string ReadMe = 6;
}

message ComponenteDto {
  string id = 1;
  string nombre = 2;
  string fechaCreacion = 3;
  string fechaUltimaModificacion = 4;
  string idUsuario = 5;
  string tipo = 6;                     
}


message CarpetaIdRequest {
  string id = 1;
}


message RegistrarCarpetaRequest {
  string idPadre = 1;
  CarpetaDto carp = 2;
}

message ActualizarCarpetaRequest {
  string id = 1;
  CarpetaDto doc = 2;
}



message ComponentesResponse {
  repeated ComponenteDto componentes = 1;
}

message EmptyResponse {
  bool success = 1;
}